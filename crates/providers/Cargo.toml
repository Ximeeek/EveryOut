[package]
name = "everyout-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Declarative manifest model and validation for EveryOut"

[dependencies]
everyout-platform-windows = { path = "../platform-windows" }
everyout-core-model = { path = "../core-model" }
everyout-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
everyout-platform-windows = { path = "../platform-windows", features = ["test-fixtures"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }
