[package]
name = "everyout-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
everyout-core-model = { path = "../core-model" }
sha2 = "0.10"
zeroize = "1"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
everyout-test-support = { path = "../test-support", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Management_Deployment", "ApplicationModel", "Foundation_Collections", "Storage", "Storage_Search", "Win32_System_WinRT", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_RestartManager", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Registry"] }

[dev-dependencies]
tempfile = "3"
everyout-platform-windows = { path = ".", features = ["test-fixtures"] }
everyout-test-support = { path = "../test-support" }

[features]
test-fixtures = ["dep:everyout-test-support"]
