[package]
name = "everyout-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
everyout-core-model = { path = "../core-model" }
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Registry"] }

[dev-dependencies]
tempfile = "3"
everyout-platform-windows = { path = ".", features = ["test-fixtures"] }

[features]
test-fixtures = ["dep:tempfile"]
