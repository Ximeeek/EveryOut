name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Isolate Windows filesystem cases
        shell: pwsh
        run: |
          $cases = @(
            'metadata_and_dry_run_then_real_deletion',
            'generated_profiles_resolve_distinct_folders_and_delete_only_selected_files',
            'fixture_guard_refuses_external_roots_and_sibling_prefix_without_effects',
            'metadata_does_not_need_content_read_access_and_lock_is_distinct',
            'traversal_absolute_sibling_prefix_and_hard_links_are_refused',
            'junctions_at_root_parent_leaf_and_recursive_child_never_redirect',
            'symlink_leaf_is_refused_or_creation_is_explicitly_unsupported',
            'target_and_ancestor_substitution_after_dry_run_are_refused',
            'root_cannot_be_replaced_during_capability_lifetime',
            'production_modules_contain_no_payload_or_network_api'
          )
          foreach ($case in $cases) {
            Write-Host "Running isolated filesystem case: $case"
            cargo test -p everyout-platform-windows --test filesystem $case -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    name: Frontend quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build

  commit-lint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from $env:BASE_SHA --to $env:HEAD_SHA --verbose
